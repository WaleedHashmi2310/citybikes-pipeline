name: citybikes
version: "1.0.0"
config-version: 2

profile: citybikes

vars:
  raw_data_path: data/raw
  gcs_bucket_name: "{{ env_var('GCS_BUCKET_NAME', 'citybikes-elt-de-bucket') }}"

model-paths:
  - models

analysis-paths:
  - analyses

test-paths:
  - tests

seed-paths:
  - data

macro-paths:
  - macros

snapshot-paths:
  - snapshots

# directory for compiled files
clean-targets:
  - target
  - dbt_packages

models:
  citybikes:
    staging:
      +materialized: view
      +schema: staging
      +persist_docs:
        relation: false
        columns: false
    marts:
      +materialized: table
      +schema: marts
      +persist_docs:
        relation: false
        columns: false

# Require dbt version
require-dbt-version: ">=1.7.0"
flags:
  require_generic_test_arguments_property: true